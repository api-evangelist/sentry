aid: sentry
name: Sentry
description: Sentry is a developer-first application monitoring platform that helps
  software teams discover, triage, and prioritize errors and performance issues in
  production. Sentry provides real-time error monitoring, performance tracing, session
  replay, profiling, and release tracking for web, mobile, and backend applications
  across 22+ platforms and languages.
